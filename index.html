<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Descubre Nicaragua - Naturaleza y Aventura</title>

    <!-- Estilos Externos -->
    <link rel="stylesheet" href="style.css">

    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZBQ51D34SW"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag() { dataLayer.push(arguments); }
        gtag('js', new Date());

        gtag('config', 'G-ZBQ51D34SW', {
            'debug_mode': true,
            'cookie_flags': 'SameSite=None;Secure'
        });
    </script>
</head>

<body>

    <div class="container">
        <h1>Explora Nicaragua 🇳🇮</h1>
        
        <div id="destination-card">
            <img id="dest-img" src="" alt="Destino">
            <h2 id="dest-name">Cargando...</h2>
            <p id="dest-desc">Buscando los mejores rincones del país...</p>
        </div>

        <div class="btn-group">
            <button class="btn btn-blue" onclick="mostrarSiguienteDestino()">
                <span>🔄</span> Siguiente Lugar
            </button>

            <button class="btn btn-green" onclick="trackCustomEvent('click_contacto', 'Interés de Viaje')">
                <span>✈️</span> Planear Viaje
            </button>
        </div>

        <div id="adblock-warning">⚠️ AdBlocker detectado. La analítica podría fallar.</div>
        
        <div class="status" id="log">Estado: Listo para explorar.</div>
    </div>

    <!-- Scripts Externos -->
    <script src="script.js"></script>
</body>

</html>
